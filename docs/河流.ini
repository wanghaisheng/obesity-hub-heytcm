*   河流与经脉在形态结构上具有极大的相似性,均类似于通道的结构,通道中都流动着某种物质。于是河流与经脉之间极大的相似性使二者产生了联系,人们开始尝试着用自然界中可观可感的河流来理解看不到、居于体内、难以观察的经脉。并发现二者之间除了形态结构外,在流动与运行方面也具有极大的相似性。于是，联想成功，古代医家便开始用河流来隐喻经脉，认识、理解经脉。
    (Rivers and meridians share great similarities in morphological structure, both resembling channels through which certain substances flow. Thus, the great similarity between rivers and meridians created a connection, and people began to try to understand the invisible, internal, and difficult-to-observe meridians by using the observable and tangible rivers of the natural world. They discovered that besides morphological structure, the two also shared great similarities in terms of flow and movement. Consequently, through successful association, ancient medical practitioners began to use rivers to metaphorically represent, understand, and comprehend meridians.)
