**Page 51 (Conclusion - 结语)**
*   本项研究运用隐喻认知学的研究方法,对中医古籍中有关河流隐喻的材料进行了收集、整理、分析,从生理、病理两方面对其进行归类。发现古代医家对人体生理、病理的部分认知,以河流隐喻认知为基础;
    (This research, using the research methods of metaphorical cognitive science, collected, organized, and analyzed materials related to river metaphors in ancient TCM texts, classifying them from physiological and pathological aspects. It was found that ancient medical practitioners' partial cognition of human physiology and pathology was based on river metaphorical cognition;)
*   在女子月经以潮水、月相为隐喻的基础之上,补充了以瀑布为始源域的女子月经模型...
    (On the basis of female menstruation being metaphorically represented by tides and moon phases, a model of female menstruation with a waterfall as the source domain was supplemented...)
*   以河流治理“河防”为始源域,进而启发临床疾病治疗的思路。
    (Taking river management "river defense" as the source domain, thereby inspiring ideas for clinical disease treatment.)
*   通过对河流隐喻下的中医基本概念进行研究,可以发现《内经》时代的医家已经初步认识到现代水循环的基本过程,并以自然界水循环的过程为始源域,进而认识人体;基于河流的隐喻认知有助于理解人体肺、肾、三焦、膀胱的生理功能;发现人体经脉的运行,八谿、九窍生理的状态,饮食水谷的运化,均以河流的通道结构、流动性为基础,具有“通”、“和”的生理特性;基于河流隐喻下人体“通”、“和”的生理特征,又进一步说明了人体病理以“不通”为特征,可表现为人体经脉的凝滞、女子