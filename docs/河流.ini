*   我国水资源应用历史悠久,在促进农田水利生产、抵御水早自然灾害等过程中积累了丰富的治水经验,相关水利著作颇丰。治水经验加强古人对河流认识的同时,也为人体生理、病理、诊疗等医学认识的形成提供了大量的经验基础。这使得河流成为中医理论形成过程中重要的隐喻认知来源。本项研究从河流隐喻认知入手,以期从河流的视角解读中医学中有关人体生命的理论。探讨在河流隐喻的认知下,古代医家想要借助河流表达什么;通过河流的隐喻分析,有哪些观点是以往我们未曾注意到的;如何运用河流的隐喻对古代相关文献进行解读,通过解读我们又能够从中获得怎样的启发;这些启发对当前中医治则治法的形成又有那些指导性的作用。
